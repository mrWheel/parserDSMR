## parserDSMR - manifest for the ESP Component Registry
## Date: 2026-11-16 · Build: 4
##
## The repository field must point at the public repository before the
## component is published.
##
## The single source of the version is PROG_VERSION in src/dsmr_parser.c.
## The registry tooling needs a static version: field here, so keep this
## value in sync with PROG_VERSION (without the leading 'v').

version: "0.9.1"
description: "Portable C11 DSMR/P1 smart-meter telegram parser with an ESP-IDF UART adapter, supporting Dutch DSMR 4.0/4.2/5.0, Belgian eMUCs and the documented European P1 OBIS profiles"
url: "https://github.com/mrWheel/parserDSMR"
repository: "https://github.com/mrWheel/parserDSMR"
documentation: "https://github.com/mrWheel/parserDSMR/blob/main/README.md"
license: "MIT"
targets:
  - esp32s3
dependencies:
  idf: ">=5.3"
